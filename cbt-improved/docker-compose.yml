# Docker Compose Configuration for CBT-Improved

services:
  # ─── Nginx ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ${CONTAINER_NGINX:-cbt_nginx}
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - websocket
    networks:
      - cbt_network

  # ─── PHP 8.3-FPM ────────────────────────────────────────────
  php:
    build:
      context: ./docker/php-fpm
      dockerfile: Dockerfile
    container_name: ${CONTAINER_PHP:-cbt_php}
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
      - ./docker/php-fpm/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cbt_network
    environment:
      - DB_HOST=${DB_HOST:-postgresql}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE:-cbt_improved}
      - DB_USERNAME=${DB_USERNAME:-cbt_user}
      - DB_PASSWORD=${DB_PASSWORD:-cbt_secret_password}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secret_password}

  # ─── WebSocket Daemon ───────────────────────────────────────
  websocket:
    build:
      context: ./docker/php-fpm
      dockerfile: Dockerfile
    container_name: ${CONTAINER_WEBSOCKET:-cbt_websocket}
    restart: unless-stopped
    command: php spark websocket:serve
    ports:
      - "127.0.0.1:8060:8060"
    volumes:
      - ./src:/var/www/html
      - ./docker/php-fpm/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cbt_network
    environment:
      - DB_HOST=${DB_HOST:-postgresql}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE:-cbt_improved}
      - DB_USERNAME=${DB_USERNAME:-cbt_user}
      - DB_PASSWORD=${DB_PASSWORD:-cbt_secret_password}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secret_password}

  # ─── PostgreSQL ─────────────────────────────────────────────
  postgresql:
    image: postgres:16-alpine
    container_name: ${CONTAINER_DB:-cbt_postgresql}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ./docker/postgresql/init:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: ${DB_DATABASE:-cbt_improved}
      POSTGRES_USER: ${DB_USERNAME:-cbt_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cbt_secret_password}
      POSTGRES_ROOT_PASSWORD: ${POSTGRES_ROOT_PASSWORD:-root_secret_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-cbt_user} -d ${DB_DATABASE:-cbt_improved}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cbt_network

  # ─── pgAdmin ────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ${CONTAINER_PGADMIN:-cbt_pgadmin}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cbt-improved.local
      PGADMIN_DEFAULT_PASSWORD: admin_password
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - cbt_network

  # ─── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ${CONTAINER_REDIS:-cbt_redis}
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret_password}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cbt_network

volumes:
  postgresql_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  cbt_network:
    driver: bridge
