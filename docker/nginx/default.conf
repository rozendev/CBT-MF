map $http_x_forwarded_proto $fastcgi_https {
    default $https;
    https on;
}

log_format security '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

map $status $security_log {
    ~^40[34]$ 1;
    default 0;
}

# Compression — most assets are text and compress 4-5x. Critical on slow
# school networks (60kbps links make 1MB of raw assets take ~2 minutes).
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    text/xml
    image/svg+xml
    application/vnd.ms-fontobject
    application/x-font-ttf
    font/opentype;

server {
    listen 80;
    listen [::]:80;
    
    # Catch-all server name
    server_name _;

    root /var/www/html/public;
    index index.php index.html index.htm;

    client_max_body_size 50M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; script-src 'self' https://code.jquery.com https://cdn.jsdelivr.net https://static.cloudflareinsights.com 'unsafe-inline' 'unsafe-eval'; style-src 'self' https://fonts.googleapis.com https://cdn.jsdelivr.net 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' https://static.cloudflareinsights.com; frame-ancestors 'self'; form-action 'self'; object-src 'self';" always;

    access_log /var/log/nginx/sistem_ujian_access.log;
    access_log /var/log/nginx/security_403_404.log security if=$security_log;
    error_log /var/log/nginx/sistem_ujian_error.log;

    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 503 /errors/maintenance.html;

    # Maintenance status probe — exempt from the flag gate so the
    # troubleshooting page can poll it while the app is unreachable.
    location = /maintenance-check.php {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS $fastcgi_https if_not_empty;
    }

    # Admin & login stay reachable during MANUAL maintenance (admins must be
    # able to log in and turn the mode off), but are blocked during a Redis
    # outage: sessions cannot work anyway and a blank 500 is useless.
    location ^~ /admin {
        if (-f /var/www/html/writable/.maintenance_redis) {
            return 503;
        }
        try_files $uri $uri/ /index.php$is_args$args;
    }
    location ^~ /login {
        if (-f /var/www/html/writable/.maintenance_redis) {
            return 503;
        }
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ^~ /errors/ {
        internal;
        root /usr/share/nginx/html;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; frame-ancestors 'self'; form-action 'self'; object-src 'self';" always;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        # Maintenance flag gate: when Redis is down or manual maintenance is
        # active, serve the static troubleshooting page directly from nginx —
        # no PHP involved. Flags live in writable/ (public/ is not writable
        # by php-fpm) and are maintained by `php spark redis:probe` (cron)
        # and the admin maintenance toggle.
        if (-f /var/www/html/writable/.maintenance_redis) {
            return 503;
        }
        if (-f /var/www/html/writable/.maintenance_manual) {
            return 503;
        }
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Sector 2 — app logic (exam-app.js/css, vendor): immutable, versi di URL.
    # Content-hash versioning di generator (StaticExamController) menjamin URL
    # berubah hanya saat isi berubah, sehingga cache 1 tahun aman.
    location ^~ /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Sector 1 — halaman statis ujian (data inline): revalidasi tiap kunjungan
    # (ETag/304 murah), badan tetap di-cache browser — aman utk regenerasi.
    location ^~ /static/ {
        expires 0;
        access_log off;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Kiosk UI bundle — must-revalidate agar update bundle tidak ter-cache lama
    location ^~ /ui-bundle/ {
        expires 0;
        access_log off;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # WebSocket proxy
    location /ws/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_websocket http://websocket:8060;
        proxy_pass $upstream_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS $fastcgi_https if_not_empty;
    }

    location ~* \.(ico|css|js|gif|jpeg|jpg|png|woff|ttf|otf|woff2|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.svg$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox;" always;
    }
}
