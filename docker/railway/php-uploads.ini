; Aturan unggah di aplikasi membatasi .docx pada 5 MB (max_size[word_file,5120]),
; tapi bawaan PHP cuma 2 MB. Tanpa ini, file di antara 2-5 MB ditolak PHP
; sebelum aturan aplikasi sempat jalan -- dan $_POST ikut kosong sehingga
; kegagalannya muncul sebagai error CSRF, bukan sebagai pesan ukuran file.
upload_max_filesize = 8M
post_max_size = 10M
memory_limit = 256M
max_execution_time = 120
