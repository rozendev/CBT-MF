services:
  # ─── Nginx ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ${CONTAINER_NGINX}
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - websocket
    networks:
      - ujian_network

  # ─── PHP 8.5-FPM ────────────────────────────────────────────
  php:
    build:
      context: ./docker/php-fpm
      dockerfile: Dockerfile
    container_name: ${CONTAINER_PHP}
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ujian_network
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}

  # ─── WebSocket Daemon ───────────────────────────────────────
  websocket:
    build:
      context: ./docker/php-fpm
      dockerfile: Dockerfile
    container_name: ${CONTAINER_WEBSOCKET}
    restart: unless-stopped
    command: php spark websocket:serve
    ports:
      - "127.0.0.1:8060:8060"
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ujian_network
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}

  # ─── Cloudflare Tunnel ──────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ${CONTAINER_CLOUDFLARED}
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - ujian_network

  # ─── MariaDB ────────────────────────────────────────────────
  mariadb:
    image: mariadb:latest
    container_name: ${CONTAINER_DB}
    restart: unless-stopped
    command: --max_connections=500
    ports:
      - "127.0.0.1:3306:3306"    # bind ke localhost aja, bukan 0.0.0.0
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ujian_network

  # ─── phpMyAdmin ─────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ${CONTAINER_PHPMYADMIN}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"      # localhost only, JANGAN lewat tunnel
    environment:
      PMA_HOST: ${DB_HOST}
      PMA_PORT: ${DB_PORT}
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
      UPLOAD_LIMIT: 64M
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - ujian_network

  # ─── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: ${CONTAINER_REDIS}
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"    # localhost only
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ujian_network

volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local

networks:
  ujian_network:
    driver: bridge
