services:
  # ─── Nginx ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ujian_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - ujian_network

  # ─── PHP 8.5-FPM ────────────────────────────────────────────
  php:
    build:
      context: ./docker/php-fpm
      dockerfile: Dockerfile
    container_name: ujian_php
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ujian_network
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=cbt-mf
      - DB_USERNAME=sayasukakamu
      - DB_PASSWORD=sayasukakamu
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  # ─── WebSocket Daemon ───────────────────────────────────────
  websocket:
    build:
      context: ./docker/php-fpm
      dockerfile: Dockerfile
    container_name: ujian_websocket
    restart: unless-stopped
    command: php spark websocket:serve
    ports:
      - "127.0.0.1:8060:8060"
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ujian_network
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=cbt-mf
      - DB_USERNAME=sayasukakamu
      - DB_PASSWORD=sayasukakamu
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  # ─── Cloudflare Tunnel ──────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ujian_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - ujian_network

  # ─── MariaDB ────────────────────────────────────────────────
  mariadb:
    image: mariadb:latest
    container_name: ujian_mariadb
    restart: unless-stopped
    command: --max_connections=500
    ports:
      - "127.0.0.1:3306:3306"    # bind ke localhost aja, bukan 0.0.0.0
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: cbt-mf
      MYSQL_USER: sayasukakamu
      MYSQL_PASSWORD: sayasukakamu
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ujian_network

  # ─── phpMyAdmin ─────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ujian_phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"      # localhost only, JANGAN lewat tunnel
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: sayasukakamu
      PMA_PASSWORD: sayasukakamu
      UPLOAD_LIMIT: 64M
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - ujian_network

  # ─── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: ujian_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"    # localhost only
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ujian_network

volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local

networks:
  ujian_network:
    driver: bridge
